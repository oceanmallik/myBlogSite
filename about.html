	<link rel="stylesheet" href="/assets/css/global.css">
	<script>
		(function () {
			var storedTheme = localStorage.getItem("theme");
			var startTheme;

			if (storedTheme === "dark" || storedTheme === "light" || storedTheme === "cyberpunk") {
				startTheme = storedTheme;
			} else {
				startTheme = "dark";
			}

			document.documentElement.setAttribute("data-theme", startTheme);
		})();
	</script>
	<style>html,body{height:100%}</style>
</head>
<body>
	<header>
		<div class="header-row">
			<h1><a class="site-brand" href="/"><span class="brand-main"></span><span class="brand-talks">Talks</span>Ocean Mallik Talks</a></h1>
			<nav>
				<a href="/">Home</a>
				<a href="/archive.html">Archive</a>
				<a href="/about.html">About</a>
			</nav>
		</div>
		<div class="header-controls">
			<a class="nav-support" href="/support.html">Support Me</a>
			<div class="theme-control-group">
				<button id="theme-toggle" type="button" aria-label="Cycle through color themes">
					<span id="theme-icon" aria-hidden="true">🌙</span>
					<span id="theme-name">Black</span>
				</button>
				<label class="theme-select-wrap" for="theme-select">
				<span class="sr-only">Choose theme</span>
				<select id="theme-select" aria-label="Choose theme">
					<option value="cyberpunk">Cyberpunk</option>
					<option value="light">White</option>
					<option value="dark">Black</option>
				</select>
				</label>
			</div>
		</div>
	</header>

	<main>
<h2>About</h2>

<p>Hi, I am Ocean Mallik.</p>

<p>This is my personal blog at <a href="https://blog.oceanmallik.com">blog.oceanmallik.com</a>, where I publish posts about my life updates.</p>
	</main>

	<footer>
		<div class="footer-content">
			<p>&copy; 2026 Ocean Mallik. Built with curiosity and too much caffeine.</p>
			<div class="footer-links">
				<a href="/archive.html">Archive</a>
			</div>
		</div>
	</footer>

	<script>
		(function () {
			var themes = ["cyberpunk", "light", "dark"];
			var labels = { dark: "Black", light: "White", cyberpunk: "Cyberpunk" };
			var icons = { dark: "🌙", light: "☀️", cyberpunk: "⚡" };
			var button = document.getElementById("theme-toggle");
			var icon = document.getElementById("theme-icon");
			var name = document.getElementById("theme-name");
			var select = document.getElementById("theme-select");
			if (!button) {
				return;
			}
			var currentTheme = document.documentElement.getAttribute("data-theme") || "dark";

			function applyTheme(theme) {
				document.documentElement.setAttribute("data-theme", theme);
				localStorage.setItem("theme", theme);
				button.setAttribute("aria-label", "Theme: " + labels[theme]);
				button.title = "Theme: " + labels[theme];
				if (icon) {
					icon.textContent = icons[theme] || "🎨";
				}
				if (name) {
					name.textContent = labels[theme] || "Theme";
				}
				if (select) {
					select.value = theme;
				}

			}

			applyTheme(currentTheme);

			button.addEventListener("click", function () {
				var index = themes.indexOf(currentTheme);
				currentTheme = themes[(index + 1) % themes.length];
				applyTheme(currentTheme);
			});

			if (select) {
				select.addEventListener("change", function (event) {
					currentTheme = event.target.value;
					applyTheme(currentTheme);
				});
			}
		})();
	</script>
</body>
