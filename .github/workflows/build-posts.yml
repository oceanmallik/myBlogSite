name: Build posts

on:
  push:
    paths:
      - 'incoming_posts/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run converter
        run: |
          python scripts/build_posts.py

      - name: Commit generated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: generate posts from incoming_posts [skip ci]" || true
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare site directory for deploy
        run: |
          rm -rf site
          mkdir site
          # copy core pages
          cp index.html site/ || true
          cp archive.html site/ || true
          cp about.html site/ || true
          cp support.html site/ || true
          cp 404.html site/ || true
          cp CNAME site/ || true
          # copy assets and posts
          cp -r posts site/ || true
          cp -r assets site/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
